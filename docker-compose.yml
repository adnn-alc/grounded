services:
  grounded:
    build: .
    container_name: grounded
    ports:
      - 5555:3001 # change left side for a different host port
    volumes:
      - ./data:/app/data # SQLite DB lives in the data/ folder next to this file
    environment:
      - NODE_ENV=production
      - DB_PATH=/app/data/grounded.db
    restart: unless-stopped
    networks: # remove this block (and the one at the bottom) if you don't have a "media_net" network
      - media_net
networks: # remove this block too, or create the network first: docker network create media_net
  media_net:
    external: true
