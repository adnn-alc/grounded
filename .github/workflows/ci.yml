name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    name: Build & smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm

      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

      # Starts the real server on an empty database, like a brand-new install,
      # and checks that every endpoint answers (this would have caught the
      # missing-columns bug fixed in e981bb5)
      - name: Smoke test on a fresh database
        env:
          NODE_ENV: production
          DB_PATH: ${{ runner.temp }}/ci.db
          PORT: 3001
        run: |
          node server/index.ts > server.log 2>&1 &
          for i in $(seq 1 30); do curl -sf localhost:3001/api/health > /dev/null && break; sleep 1; done
          fail() { echo "::error::$1"; cat server.log; exit 1; }
          for path in health shots brews beans beans/archived gear recipes tips settings; do
            curl -sf "localhost:3001/api/$path" > /dev/null || fail "GET /api/$path failed"
          done
          curl -sf -X POST -H 'Content-Type: application/json' \
            -d '{"kind":"Grinder","name":"CI grinder","status":"Active","price":1}' \
            localhost:3001/api/gear > /dev/null || fail "POST /api/gear failed"
          curl -sf -X PUT -H 'Content-Type: application/json' \
            -d '{"units":{"mass":"g","temp":"C"}}' \
            localhost:3001/api/settings > /dev/null || fail "PUT /api/settings failed"
          curl -sf localhost:3001/ | grep -q 'id="root"' || fail "frontend not served"
          # Bad input and unknown ids answer 400/404 with a JSON error, not a crash
          status() { curl -s -o /dev/null -w '%{http_code}' -H 'Content-Type: application/json' "$@"; }
          [ "$(status -X POST -d '{"name":""}' localhost:3001/api/beans)" = 400 ] || fail "invalid bean not rejected with 400"
          [ "$(status -X PUT -d '{"date":"2026-01-01 08:00","rating":5}' localhost:3001/api/shots/nope)" = 404 ] || fail "unknown shot not 404"
          [ "$(status localhost:3001/api/nope)" = 404 ] || fail "unknown endpoint not 404"
          echo "All endpoints OK"

  docker:
    name: Docker image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - run: docker build -t grounded:ci .

      - name: Run the image and check it answers
        run: |
          docker run -d --name grounded-ci -p 3001:3001 grounded:ci
          for i in $(seq 1 30); do curl -sf localhost:3001/api/health > /dev/null && break; sleep 1; done
          curl -sf localhost:3001/api/health || { docker logs grounded-ci; exit 1; }
          curl -sf localhost:3001/ | grep -q 'id="root"' || { docker logs grounded-ci; exit 1; }
          docker rm -f grounded-ci

      # Like an upgrade from a version that ran as root: the mounted data folder and
      # database belong to root. The app must still run as node (uid 1000) and write.
      - name: Run as non-root with a root-owned data folder
        run: |
          sudo mkdir -p ci-data && sudo touch ci-data/old-root-file && sudo chown -R 0:0 ci-data
          docker run -d --name grounded-ci -p 3001:3001 -v "$PWD/ci-data:/app/data" grounded:ci
          for i in $(seq 1 30); do curl -sf localhost:3001/api/health > /dev/null && break; sleep 1; done
          fail() { echo "::error::$1"; docker logs grounded-ci; exit 1; }
          [ "$(docker exec grounded-ci sh -c 'stat -c %u /proc/1')" = 1000 ] || fail "app is not running as uid 1000"
          curl -sf -X POST -H 'Content-Type: application/json' -d '{"kind":"Scale","name":"CI scale"}' \
            localhost:3001/api/gear > /dev/null || fail "could not write to the database"
          [ "$(stat -c %u ci-data/grounded.db)" = 1000 ] || fail "database file not owned by uid 1000"
          docker stop grounded-ci > /dev/null
          [ ! -s ci-data/grounded.db-wal ] || fail "database not closed cleanly on stop"
          docker rm grounded-ci > /dev/null
          echo 'Runs as uid 1000 and writes to a formerly root-owned folder'
